<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TopTalk — Fall For How They Talk</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- AUTH -->
<div id="authPage" class="auth-wrap">
  <h1>TOP<span>TALK</span></h1>
  <p>Fall for how they talk.</p>
  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLoginBtn" onclick="showAuth('login')">Log In</button>
      <button class="auth-tab" id="tabSignupBtn" onclick="showAuth('signup')">Create Account</button>
    </div>
    <div class="auth-error" id="authError"></div>

    <div id="loginForm">
      <div class="auth-label">TOPSHUGAR Email</div>
      <input class="auth-input" id="loginEmail" type="email" placeholder="you@topshugar.site" />
      <div class="auth-label">Password</div>
      <input class="auth-input" id="loginPassword" type="password" placeholder="Your password" />
      <button class="btn-primary" onclick="doLogin()">Log In to TopTalk</button>
    </div>

    <div id="signupForm" style="display:none">
      <div class="auth-label">First Name</div>
      <input class="auth-input" id="suName" placeholder="e.g. Ada" />
      <div class="auth-label">Age (18+)</div>
      <input class="auth-input" id="suAge" type="number" placeholder="22" />
      <div class="auth-label">City</div>
      <select class="auth-input" id="suCity"><option>Lagos</option><option>Abuja</option><option>Port Harcourt</option><option>Ibadan</option><option>Enugu</option><option>Kano</option><option>Other</option></select>
      <div class="auth-label">TOPSHUGAR Email</div>
      <input class="auth-input" id="suEmail" type="email" placeholder="you@topshugar.site" />
      <div class="auth-label">Password (min. 6)</div>
      <input class="auth-input" id="suPassword" type="password" placeholder="Create password" />
      <button class="btn-primary" onclick="doSignup()">Create My Account</button>
    </div>
  </div>
  <div class="domain-box">
    Need a @topshugar.site email? <a href="https://topshugar.github.io/TOPSHUGAR/" target="_blank">Get one here</a>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" style="display:none">
  <div class="header">
    <b>TOP<span>TALK</span></b>
    <div style="display:flex;gap:8px">
      <a href="earn.html" class="earn-btn">💰 Earn</a>
      <button class="header-btn" onclick="switchTab('matches')">Matches</button>
      <button class="btn-ghost" onclick="doLogout()">Log Out</button>
    </div>
  </div>
  <div class="wrap">
    <div class="hero">
      <h1>Welcome back, <em id="heroName">Top</em></h1>
      <a href="earn.html" class="earn-big">💰 Earn Sats → Buy Airtime</a>
    </div>
    <div class="tabs">
      <button class="tab active" id="tab-feed" onclick="switchTab('feed')">Talk</button>
      <button class="tab" id="tab-discover" onclick="switchTab('discover')">Discover</button>
      <button class="tab" id="tab-matches" onclick="switchTab('matches')">Matches <span id="matchCount">0</span></button>
      <button class="tab" id="tab-profile" onclick="switchTab('profile')">Me</button>
    </div>
    <div id="page-feed">
      <div class="card">
        <textarea id="postText" placeholder="Say something real..." maxlength="280" oninput="updateChar()"></textarea>
        <div class="composer-foot"><span id="charCount">280 left</span><button class="btn-post" id="postBtn" onclick="createPost()" disabled>Post Talk</button></div>
      </div>
      <div id="feed"></div>
    </div>
    <div id="page-discover" style="display:none"><div id="discoverList"></div></div>
    <div id="page-matches" style="display:none"><div id="matchesList"></div><div id="chatArea" style="display:none"><b id="chatWith">Chat</b><div class="chat-box" id="chatBox"></div><div class="chat-input"><input id="chatInput" placeholder="Say something kind." /><button class="btn-dark" onclick="sendChat()">Send</button></div></div></div>
    <div id="page-profile" style="display:none"><div class="card"><b id="myName">Top User</b><p id="myEmail"></p><input class="full-input" id="editBio" placeholder="Your bio" /><button class="btn-primary" onclick="saveProfile()">Save My Profile</button></div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
